{% extends "base.html" %}
{% block titulo %}Red · Dispositivos · Mapa de frecuencias{% endblock %}
{% block contenido %}

<div class="page-heading">
<div class="page-heading-copy">
    <span class="page-icon"><i class="bi bi-router" aria-hidden="true"></i></span>
    <div>
    <!-- <p class="eyebrow mb-1">Gestión · Portal WISP</p> -->
    <h1 class="h3 mb-1">Mapa de frecuencias</h1>
    <!-- <p class="text-muted mb-0">Review accounts, roles, account status, and team ownership.</p> -->
    </div>
</div>
</div>

<section class="panel row g-3 mt-1">
<form class="row g-2 mb-3"
      hx-get="{% url 'dispositivos:frecuencias' %}"
      hx-target="#tabla-frecuencias"
      hx-trigger="input changed delay:500ms from:#id_q, change from:#id_sector"
      hx-push-url="true">

    <div class="col-md-5">
        <input type="text" name="q" id="id_q" class="form-control"
               placeholder="Buscar por nombre, IP o MAC..." value="{{ busqueda }}">
    </div>

    <div class="col-md-3">
        <select name="sector" id="id_sector" class="form-select">
            <option value="">Todos los sectores</option>
            {% for valor, etiqueta in todos_sectores %}
            <option value="{{ valor }}" {% if valor == sector_seleccionado %}selected{% endif %}>{{ etiqueta }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="col-md-3">
        <select name="sector2" id="id_sector2" class="form-select">
            <option value="">Todos los sectores</option>
            {% for valor, etiqueta in todos_sectores %}
            <option value="{{ valor }}" {% if valor == sector_seleccionado2 %}selected{% endif %}>{{ etiqueta }}</option>
            {% endfor %}
        </select>
    </div>
</form>

<!-- <section class="panel mt-1"> -->
<div id="tabla-frecuencias" class="table-responsive mt-1">
{% include "dispositivo/frecuencias/_tabla_frecuancia.html" %}
</div>
<!-- </section> -->

</section>
{% endblock %}
