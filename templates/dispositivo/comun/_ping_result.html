    <div class="modal-header">
        <h2 class="modal-title h5" id="confirmModalLabel">Resultado del Ping </h2>
    </div>
    <div class="modal-body">
    {% if exitoso == True %}
        <p>Latencia media : {{ latencia }} ms</p>
        {% if resultado %}
        <p>
        {% for r in resultado %}
            {{ r }}<br>
        {% endfor %}
        </p>
        {% endif %}
    {% else %}
    <p class="text-danger">Error al ejecutar el ping<br>{{ error_msg }}</p>
    {% endif %}
    </div>
    <div class="modal-footer">
        <button type="button" 
                class="btn btn-primary" 
                data-bs-dismiss="modal"
                id="cerrarPingModal"
                onclick="mensajeModalPing()">
                Aceptar
        </button>
    </div>
